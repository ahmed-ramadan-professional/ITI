<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body class="mt-2 p-4">
        <div class="d-flex flex-row justify-content-between">
            <div class="d-flex flex-row align-items-center">
                <select class="form-select perPageSelect" id="perPageSelect">
                    <option selected value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <label for="perPageSelect" class="mx-2">Per Page</label>
            </div>
            <span>Ahmed Ramadan</span>
            <div class="d-flex flex-row align-items-center">
                <label for="searchInput" class="mx-2">Search</label>
                <input class="form-control" id="searchInput" type="text" />
            </div>
        </div>
        <div>
            <table class="table table-striped table-responsive">
                <thead>
                    <tr id="defaultRow" style="display: none">
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td><button class="btn btn-primary">Edit</button></td>
                        <td><button class="btn btn-danger">Delete</button></td>
                    </tr>
                    <tr id="defaultEditRow" style="display: none">
                        <td></td>
                        <td>
                            <input
                                class="form-control"
                                placeholder="name"
                                type="text" />
                        </td>
                        <td>
                            <input
                                class="form-control"
                                placeholder="position"
                                type="text" />
                        </td>
                        <td>
                            <input
                                class="form-control"
                                placeholder="office"
                                type="text" />
                        </td>
                        <td>
                            <input
                                class="form-control"
                                placeholder="age"
                                type="number"
                                min="16" />
                        </td>
                        <td>
                            <input
                                class="form-control"
                                placeholder="start date"
                                type="text" />
                        </td>
                        <td>
                            <input
                                class="form-control"
                                placeholder="salary"
                                type="number"
                                min="1" />
                        </td>
                        <td><button class="btn btn-primary">Save</button></td>
                        <td><button class="btn btn-danger">Cancel</button></td>
                    </tr>
                    <tr>
                        <th style="width: 50px">#</th>
                        <th
                            id="th1"
                            class="inactive"
                            onclick="sortTable(1)"
                            data-sort-name="name">
                            Name
                        </th>
                        <th
                            id="th2"
                            class="inactive"
                            onclick="sortTable(2)"
                            data-sort-name="position">
                            Position
                        </th>
                        <th
                            id="th3"
                            class="inactive"
                            onclick="sortTable(3)"
                            data-sort-name="office">
                            Office
                        </th>
                        <th
                            id="th4"
                            class="inactive"
                            onclick="sortTable(4)"
                            data-sort-name="age">
                            Age
                        </th>
                        <th
                            id="th5"
                            class="inactive"
                            onclick="sortTable(5)"
                            data-sort-name="start_date">
                            Start Date
                        </th>
                        <th
                            id="th6"
                            class="inactive"
                            onclick="sortTable(6)"
                            data-sort-name="salary">
                            Salary
                        </th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            <div class="d-flex justify-content-between pe-5">
                <div class="d-flex flex-row gap-2 align-items-start">
                    <span id="info">Showing</span>
                    <nav aria-label="...">
                        <li
                            id="defaultPage"
                            style="display: none"
                            class="page-item">
                            <button class="page-link">1</button>
                        </li>
                        <ul id="pagination" class="pagination"></ul>
                    </nav>
                </div>
                <div class="d-flex justify-content-end">
                    <button
                        id="add"
                        class="btn btn-success me-5"
                        style="height: 80%;"
                        onclick="add()">
                        Add Employee
                    </button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    </body>
</html>
