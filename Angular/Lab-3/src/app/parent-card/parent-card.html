<div class="parent-wrapper">
  <div class="chains">
    <div class="chain-wrapper" [class.drop]="drop">
      <div class="chain left dangling">
        <img src="chains.png" width="" height="100" alt="" />
      </div>
    </div>

    <div class="chain right dangling3">
      <img src="chains.png" width="" height="100" alt="" />
    </div>
  </div>
  <div class="custom-card">
    <h3>
      <i class="fa-solid fa-user"></i>
      Parent Card
    </h3>

    <p [class.dropped]="drop">Click the hanging card to send profile info</p>

    <div *ngIf="profileSelected" class="alert alert-info mt-3 p-2">
      <strong>{{ profileSelected.name }}</strong
      ><br />
      {{ profileSelected.role }}<br />
    </div>

    <div class="child-wrapper" [class.drop]="drop">
      <div class="child-card dangling2" >
        <app-button-card (profileSelected)="receiveProfile($event)" (dropEvent)="triggerDrop()">
        </app-button-card>
      </div>
    </div>
  </div>
</div>
