<section class="custom-card">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
    <div class="text-start">
      <h1 class="mb-2">Students</h1>
      <p class="section-subtitle mb-2">This page shows all students currently stored in the shared service.</p>
      <div class="student-summary" *ngIf="totalStudents$ | async as totalStudents">
        <span class="summary-badge">{{ totalStudents }} total students</span>
      </div>
    </div>
    <div class="page-actions">
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-primary" routerLink="/add-student">Add New Student</a>
        <a class="btn btn-outline-light" routerLink="/home">Back to Home</a>
      </div>
    </div>
  </div>

  <div class="filter-panel mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-5">
        <label for="studentSearch" class="form-label table-filter-label">Search By Name</label>
        <input
          id="studentSearch"
          name="studentSearch"
          type="text"
          class="form-control"
          placeholder="Type first or last name"
          [(ngModel)]="searchTerm"
          (ngModelChange)="onSearchChange()"
        />
      </div>

      <div class="col-12 col-md-4">
        <label for="departmentFilter" class="form-label table-filter-label">Filter By Department</label>
        <app-custom-select
          id="departmentFilter"
          name="departmentFilter"
          [options]="(departments$ | async) ?? []"
          placeholder="All Departments"
          [(ngModel)]="selectedDepartment"
          (ngModelChange)="onDepartmentChange()"
        ></app-custom-select>
      </div>

      <div class="col-12 col-md-3">
        <button type="button" class="btn btn-outline-light w-100" (click)="clearFilters()">Clear Filters</button>
      </div>
    </div>
  </div>

  <ng-container *ngIf="students$ | async as students">
    <div class="results-row mb-3">
      <span class="results-text">{{ students.length }} students shown</span>
    </div>
    <app-student-table
      [students]="students"
      [hasActiveFilters]="hasActiveFilters"
      (viewStudent)="onViewStudent($event)"
      (editStudent)="onEditStudent($event)"
      (deleteStudent)="onDeleteStudent($event)"
    ></app-student-table>
  </ng-container>
</section>
